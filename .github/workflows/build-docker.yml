
name: CI - Build et Push Docker sur Nexus

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupère le code de votre dépôt
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Configure le builder Docker (Buildx)  
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            {
              "insecure-registries": ["${{ secrets.NEXUS_REGISTRY_URL }}"]
            }

      # 3. Connexion au registry Nexus
      - name: Login sur le Registry Nexus
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_REGISTRY_URL }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      # 4. Build et Push de l'image
      - name: Build et Push de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Le "tag" est le nom de votre image.
          # Il DOIT commencer par l'URL de votre registry Nexus.
          tags: ${{ secrets.NEXUS_REGISTRY_URL }}/mon-app:latest
