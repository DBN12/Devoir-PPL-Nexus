name: CI - Build et Push Docker sur Nexus

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Récupère le code
      - name: Checkout du code
        uses: actions/checkout@v4
      
      # 2. Configuration du daemon Docker pour registry insecure
      # IMPORTANT: Ceci doit se faire AVANT le setup de Buildx
      - name: Configure Docker daemon for insecure registry
        run: |
          echo '{
            "insecure-registries": ["${{ secrets.NEXUS_REGISTRY_URL }}"]
          }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          # Attendre que Docker redémarre complètement
          sleep 10
          # Vérifier que Docker est prêt
          docker info
      
      # 3. Set up Docker Buildx avec le driver docker (utilise le daemon configuré)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
          # Utilise le daemon Docker au lieu de docker-container
          # Cela permet d'utiliser la config insecure-registries
      
      # 4. Connexion au registry Nexus
      # Maintenant que le daemon est configuré, le login devrait fonctionner
      - name: Login sur le Registry Nexus
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_REGISTRY_URL }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}
      
      # 5. Build et Push de l'image
      - name: Build et Push de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.NEXUS_REGISTRY_URL }}/mon-app:latest
          # Le driver "docker" utilise le daemon Docker configuré
