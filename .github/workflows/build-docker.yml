name: CI - Build et Push Docker sur Nexus

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupère le code de votre dépôt
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Configure Docker pour le registry HTTP
  
      - name: Configure Docker for insecure registry
        run: |
          echo '{"insecure-registries":["${{ secrets.NEXUS_REGISTRY_URL }}"]}' | sudo tee /etc/docker/daemon.json
          sudo service docker restart

      # 3. Configure le builder Docker (Buildx)
      
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      # 4. Connexion au registry Nexus
      
      - name: Login sur le Registry Nexus
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_REGISTRY_URL }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      # 5. Build et Push de l'image
      - name: Build et Push de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.NEXUS_REGISTRY_URL }}/mon-app:latest
